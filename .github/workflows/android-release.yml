name: Android release
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: true

jobs:
  build-release:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      YTB_ANDROID_KEYSTORE_BASE64: ${{ secrets.YTB_ANDROID_KEYSTORE_BASE64 }}
      YTB_ANDROID_KEY_ALIAS: ${{ secrets.YTB_ANDROID_KEY_ALIAS }}
      YTB_ANDROID_KEY_PASSWORD: ${{ secrets.YTB_ANDROID_KEY_PASSWORD }}
      YTB_ANDROID_STORE_PASSWORD: ${{ secrets.YTB_ANDROID_STORE_PASSWORD }}
      YTB_UPDATE_REPOSITORY: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true
      - name: Check Flutter
        working-directory: apps/native
        run: |
          flutter pub get
          flutter analyze
          flutter test test
      - name: Kotlin regression tests
        working-directory: apps/native/android
        run: ./gradlew :app:testDebugUnitTest
      - name: Missing signing key
        if: env.YTB_ANDROID_KEYSTORE_BASE64 == ''
        run: echo 'Checks passed. Signed publishing is disabled until the existing app signing key is configured; never generate a replacement key.'
      - name: Prepare signing key
        if: env.YTB_ANDROID_KEYSTORE_BASE64 != ''
        shell: bash
        run: |
          set -euo pipefail
          test -n "$YTB_ANDROID_KEYSTORE_BASE64"
          test -n "$YTB_ANDROID_KEY_ALIAS"
          test -n "$YTB_ANDROID_KEY_PASSWORD"
          test -n "$YTB_ANDROID_STORE_PASSWORD"
          export YTB_ANDROID_KEYSTORE="$RUNNER_TEMP/ytb-signing.jks"
          python3 -c 'import base64,os; open(os.environ["YTB_ANDROID_KEYSTORE"],"wb").write(base64.b64decode(os.environ["YTB_ANDROID_KEYSTORE_BASE64"],validate=True))'
          echo "YTB_ANDROID_KEYSTORE=$YTB_ANDROID_KEYSTORE" >> "$GITHUB_ENV"
      - name: Build release
        if: env.YTB_ANDROID_KEYSTORE_BASE64 != ''
        shell: bash
        run: |
          set -euo pipefail
          export YTB_BUILD_CODE="$(sed -nE 's/^version:.*\+([0-9]+)$/\1/p' apps/native/pubspec.yaml)"
          test -n "$YTB_BUILD_CODE"
          echo "YTB_BUILD_CODE=$YTB_BUILD_CODE" >> "$GITHUB_ENV"
          cd apps/native
          flutter build apk --release --target-platform android-arm,android-arm64,android-x64 --build-number "$YTB_BUILD_CODE"
      - name: Publish release
        if: env.YTB_ANDROID_KEYSTORE_BASE64 != ''
        shell: bash
        run: |
          set -euo pipefail
          # Refuse an APK that cannot update the previously published app.
          mkdir -p "$RUNNER_TEMP/previous-apk"
          gh release download --repo "$GITHUB_REPOSITORY" --pattern '*.apk' --dir "$RUNNER_TEMP/previous-apk"
          signer="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)"
          old_cert="$($signer verify --print-certs "$RUNNER_TEMP"/previous-apk/*.apk | sed -n 's/Signer #1 certificate SHA-256 digest: //p')"
          new_cert="$($signer verify --print-certs apps/native/build/app/outputs/flutter-apk/app-release.apk | sed -n 's/Signer #1 certificate SHA-256 digest: //p')"
          test -n "$old_cert" && test "$old_cert" = "$new_cert"
          gh release create "build-$YTB_BUILD_CODE" "apps/native/build/app/outputs/flutter-apk/app-release.apk#Diu-Tup.apk" --target "$GITHUB_SHA" --title "Diu Túp build $YTB_BUILD_CODE" --notes "Bản Android được build tự động từ nhánh chính." --latest
      - name: Remove temporary signing key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/ytb-signing.jks"
